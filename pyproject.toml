[project]
name = "meteor-shower-forecast"
version = "0.1.0"
description = "Realistic per-location meteor-shower rate estimates from Bortle class and radiant altitude"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "trice", email = "rtphokie@gmail.com" }
]
keywords = ["meteor", "meteor-shower", "astronomy", "stargazing", "zhr", "bortle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11"
dependencies = [
    "bortlefinder>=0.2.0",
    "timezonefinder>=6.5",
]

[project.urls]
Homepage = "https://github.com/rtphokie/meteor-shower-forecast"
Repository = "https://github.com/rtphokie/meteor-shower-forecast"
Issues = "https://github.com/rtphokie/meteor-shower-forecast/issues"

[project.optional-dependencies]
# Only needed for `bortlefinder-fetch-grid`, the one-time light-pollution
# grid fetch (see README).
build = ["bortlefinder[build]"]

[project.scripts]
meteor-shower-forecast = "meteor_shower_forecast:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
